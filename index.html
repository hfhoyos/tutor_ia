<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PQRS Inteligente</title>
    <style>
        :root { --apple-blue: #0071e3; --glass: rgba(255, 255, 255, 0.7); }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f5f5f7 0%, #d2d2d7 100%);
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; color: #1d1d1f;
        }
        .card { 
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 400px;
        }
        h1 { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 25px; }
        label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 5px 5px; color: #86868b; text-transform: uppercase; }
        input, textarea { 
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px;
            border: 1px solid #d2d2d7; background: rgba(255,255,255,0.8);
            font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s;
        }
        input:focus, textarea:focus { border-color: var(--apple-blue); box-shadow: 0 0 0 4px rgba(0,113,227,0.1); }
        button { 
            width: 100%; padding: 16px; background: var(--apple-blue); color: white;
            border: none; border-radius: 14px; font-size: 17px; font-weight: 600;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        button:hover { background: #0077ed; transform: scale(1.02); }
        button:active { transform: scale(0.98); }
        .loader { display: none; text-align: center; font-size: 14px; color: var(--apple-blue); margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Sistema PQRS</h1>
    
    <label>Nombre del Remitente</label>
    <input type="text" id="nombre" placeholder="Ej: Hugo, Paco, Luis...">
    
    <label>Tu Comentario / Perfil</label>
    <textarea id="redaccion" rows="4" placeholder="Describe la situación aquí..."></textarea>
    
    <button onclick="enviarPQRS()">Analizar y Guardar</button>
    <div id="loading" class="loader">IA procesando... un momento...</div>
</div>

<script>
    async function enviarPQRS() {
        const btn = document.querySelector('button');
        const loader = document.getElementById('loading');
        const urlScript = "https://script.google.com/macros/s/AKfycbxw-NH_fyp_l4xruviwdDlHEPV3rhKGRxTtfsvbxmhA7a_rwU0MS-lDb1vnRO4nK1lF/exec";
        



        const data = {
            nombre: document.getElementById('nombre').value,
            redaccion: document.getElementById('redaccion').value
        };

        if(!data.nombre || !data.redaccion) return alert("Por favor completa los campos");

        // UI State
        btn.style.display = 'none';
        loader.style.display = 'block';

        try {
            await fetch(urlScript, {
                method: "POST",
                mode: "no-cors", // Para evitar problemas de CORS en Apps Script
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            alert("¡Listo! La IA clasificó y guardó la PQRS de " + data.nombre);
            document.getElementById('nombre').value = '';
            document.getElementById('redaccion').value = '';
        } catch (e) {
            alert("Error al conectar con el servidor");
        } finally {
            btn.style.display = 'block';
            loader.style.display = 'none';
        }
    }
</script>

</body>
</html>
