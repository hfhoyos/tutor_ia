<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Dinámico Multi-Proyecto</title>
    <style>
        :root { 
            --apple-blue: #0071e3; 
            --glass: rgba(255, 255, 255, 0.85); 
            --apple-dark: #1d1d1f;
            --apple-grey: #86868b;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #f5f5f7 0%, #d2d2d7 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; color: var(--apple-dark);
            padding: 20px; box-sizing: border-box;
        }
        .card { 
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 35px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 480px;
        }
        h1 { font-size: 24px; font-weight: 600; text-align: center; margin-bottom: 5px; }
        .config-panel { background: rgba(0, 0, 0, 0.04); border: 1px solid rgba(0, 0, 0, 0.05); padding: 15px; border-radius: 16px; margin-bottom: 25px; }
        .config-title { font-size: 11px; font-weight: 700; color: var(--apple-blue); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; display: block; text-align: center; }
        label { display: block; font-size: 11px; font-weight: 600; margin: 10px 0 4px 4px; color: var(--apple-grey); text-transform: uppercase; }
        input, textarea { width: 100%; padding: 14px; margin-bottom: 5px; border-radius: 12px; border: 1px solid #d2d2d7; background: rgba(255,255,255,0.8); font-size: 15px; box-sizing: border-box; outline: none; }
        input:focus, textarea:focus { border-color: var(--apple-blue); box-shadow: 0 0 0 4px rgba(0,113,227,0.1); }
        .url-input { font-family: monospace; font-size: 11px; background: #ffffff; color: #424245; }
        .separator { border: 0; height: 1px; background: rgba(0,0,0,0.08); margin: 20px 0; }
        button { width: 100%; padding: 16px; background: var(--apple-blue); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 15px; }
        button:hover { background: #0077ed; }
        .loader { display: none; text-align: center; font-size: 14px; color: var(--apple-blue); margin-top: 15px; font-weight: 500; }
    </style>
</head>
<body>

<div class="card">
    <div class="config-panel">
        <span class="config-title">⚙️ Parámetros de Infraestructura</span>
        <label for="endpoint-url">URL de Ejecución Web (Apps Script)</label>
        <input type="text" id="endpoint-url" class="url-input" value="https://script.google.com/macros/s/AKfycbwpz8QgrvEANNaCBHy54Q2LfAUJnCx5jnK6k-0oVHoT-7PUuexj9AiLrIXq9eaV89EwZw/exec">
    </div>

    <h1 id="app-title">Cargando...</h1>
    <div class="separator"></div>
    
    <div id="dynamic-form-container"></div>
    
    <button id="submit-btn" onclick="procesarYEnviar()">Analizar y Guardar</button>
    <div id="loading" class="loader">IA procesando en El Sótano... un momento...</div>
</div>

<script>
    const ESPECIFICACION_PROYECTO = {
        titulo: "Sistema PQRS Inteligente",
        inputs: [
            { id: "nombre", label: "Nombre del Remitente", type: "text", placeholder: "Ej: Hugo, Paco, Luis..." },
            { id: "redaccion", label: "Tu Comentario / Perfil", type: "textarea", placeholder: "Describe la situación aquí..." }
        ]
    };

    function inicializarApp() {
        document.title = ESPECIFICACION_PROYECTO.titulo;
        document.getElementById('app-title').innerText = ESPECIFICACION_PROYECTO.titulo;
        
        const contenedor = document.getElementById('dynamic-form-container');
        contenedor.innerHTML = ''; 
        
        ESPECIFICACION_PROYECTO.inputs.forEach(inputSpec => {
            const label = document.createElement('label');
            label.innerText = inputSpec.label;
            contenedor.appendChild(label);
            
            let control = inputSpec.type === 'textarea' ? document.createElement('textarea') : document.createElement('input');
            if (inputSpec.type === 'textarea') control.rows = 4;
            else control.type = inputSpec.type;
            
            control.id = inputSpec.id;
            control.placeholder = inputSpec.placeholder;
            contenedor.appendChild(control);
        });
    }

    // Función global que ejecutará la respuesta desde Google Apps Script
    function callbackProcesar(respuesta) {
        const btn = document.getElementById('submit-btn');
        const loader = document.getElementById('loading');
        
        btn.style.display = 'block';
        loader.style.display = 'none';
        
        if (respuesta.status === "success") {
            alert("¡Transmisión verificada! Fila escrita con éxito en la Planta Baja.");
            ESPECIFICACION_PROYECTO.inputs.forEach(inputSpec => {
                document.getElementById(inputSpec.id).value = '';
            });
        } else {
            alert("Error en el Sótano: " + respuesta.mensaje);
        }
        
        // Limpieza del elemento inyectado
        const scriptViejo = document.getElementById('jsonp-script');
        if(scriptViejo) scriptViejo.remove();
    }

    function procesarYEnviar() {
        const btn = document.getElementById('submit-btn');
        const loader = document.getElementById('loading');
        const urlScript = document.getElementById('endpoint-url').value.trim();
        
        if(!urlScript) return alert("Por favor, introduce una URL válida.");

        const payloadData = {};
        let camposValidos = true;
        
        ESPECIFICACION_PROYECTO.inputs.forEach(inputSpec => {
            const valor = document.getElementById(inputSpec.id).value.trim();
            if(!valor) camposValidos = false;
            payloadData[inputSpec.id] = valor;
        });
        
        if(!camposValidos) return alert("Por favor, completa todos los campos.");
        
        btn.style.display = 'none';
        loader.style.display = 'block';
        
        // ESTRATEGIA DEFINITIVA (JSONP): Inyección de Script tag para saltar el protocolo file:///
        const urlCompleta = `${urlScript}?nombre=${encodeURIComponent(payloadData.nombre)}&redaccion=${encodeURIComponent(payloadData.redaccion)}&callback=callbackProcesar`;
        
        const script = document.createElement('script');
        script.id = 'jsonp-script';
        script.src = urlCompleta;
        
        // Al insertarlo al documento, el navegador ejecuta la petición de manera nativa e inmediata
        document.body.appendChild(script);
    }

    window.onload = inicializarApp;
</script>

</body>
</html>
